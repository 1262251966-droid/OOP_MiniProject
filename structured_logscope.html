<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogScope | Investigation Console</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><b>LOGSCOPE</b><span>LOCAL DETECTION ENGINE <i>●</i></span></div><div class="status"><i></i> READY</div></header>
<div class="shell"><aside><a href="#overview">01&nbsp; OVERVIEW</a><a href="#findingPanel">02&nbsp; FINDINGS</a><a href="#ipPanel">03&nbsp; IP ANALYSIS</a><a href="#timelinePanel">04&nbsp; TIMELINE</a><a href="#healthPanel">05&nbsp; LOG HEALTH</a><div class="side-note">LOCAL ANALYSIS<br>EXPLAINABLE RULES</div></aside><main>
<section class="panel upload"><div class="eyebrow">LOGSCOPE / ACCESS LOG INVESTIGATION</div><h1>Security overview</h1><form id="form"><label class="drop" id="drop" for="file"><strong>DROP ACCESS LOG HERE</strong><span id="fileLabel">or select a .log / .txt file · Apache or Nginx · 10 MB max</span><input id="file" name="file" type="file" accept=".log,.txt,text/plain" required></label><div class="settings"><label>401 AUTH RESPONSE THRESHOLD<input name="failThreshold" type="number" min="1" value="10"></label><label>TIME WINDOW (SECONDS)<input name="windowSeconds" type="number" min="1" value="300"></label><label>TRAFFIC THRESHOLD (RPS)<input name="rpsThreshold" type="number" min="0.01" step="0.1" value="5"></label><button class="primary">ANALYZE LOG <b>→</b></button></div><p id="message" role="status"></p></form></section>
<section id="results" hidden><div class="rowhead"><h2 id="overview">Analysis results</h2><code id="fileName"></code></div><div id="stats" class="stats"></div><div class="grid"><section id="timelinePanel" class="panel"><h3>REQUEST ACTIVITY TIMELINE</h3><div id="activity" class="bars"></div></section><section class="panel"><h3>DETECTION SUMMARY</h3><div id="summaryCounts" class="summary-counts"></div></section></div><section id="healthPanel" class="panel health"></section><section id="findingPanel" class="panel"><h3>FINDINGS</h3><div class="filters"><input id="search" placeholder="Search IP or evidence"><select id="typeFilter"><option value="">All detections</option></select><select id="severityFilter"><option value="">All severities</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option></select></div><div id="findings"></div></section><section id="endpointPanel" class="panel"><h3>ENDPOINT ANALYSIS</h3><div id="endpoints"></div></section><section id="ipPanel" class="panel"><h3>IP ANALYSIS</h3><div id="ips"></div></section><section id="ipDetail" class="panel detail" hidden></section></section></main></div><script src="/app.js"></script></body></html>
